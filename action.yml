name: aws-iam-trust-audit
description: Audit IAM role trust policies for wildcard principals, cross-account AssumeRole without ExternalId and over-broad OIDC subjects.
branding:
  icon: shield
  color: orange

inputs:
  dir:
    description: Directory (or file) of trust policy JSON to audit.
    required: false
    default: ./iam/roles
  from-aws:
    description: Read roles live with iam:ListRoles instead of from dir. Needs AWS credentials in the environment, e.g. from aws-actions/configure-aws-credentials.
    required: false
    default: "false"
  role-path:
    description: With from-aws, only audit roles under this IAM path, e.g. /ci/.
    required: false
    default: ""
  format:
    description: Output format — table, json, markdown or sarif.
    required: false
    default: table
  trusted-accounts:
    description: Comma-separated account ids that are expected to appear.
    required: false
    default: ""
  min-severity:
    description: Report findings at this severity and above — warning or error.
    required: false
    default: warning
  fail-on:
    description: Fail the step when a finding reaches this severity — warning, error or never.
    required: false
    default: error
  ignore:
    description: Comma-separated rule names to suppress.
    required: false
    default: ""
  account:
    description: Account that owns these roles; defaults to the account in each role ARN.
    required: false
    default: ""
  go-version:
    description: Go toolchain used to build the auditor.
    required: false
    default: "1.27"

outputs:
  exit-code:
    description: 0 clean, 1 findings at or above fail-on, 2 a parse, usage or AWS API error.
    value: ${{ steps.audit.outputs.exit-code }}
  report:
    description: The rendered report.
    value: ${{ steps.audit.outputs.report }}
  report-file:
    description: Path of the rendered report, e.g. for github/codeql-action/upload-sarif when format is sarif.
    value: ${{ steps.audit.outputs.report-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    - name: Build aws-iam-trust-audit
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "$RUNNER_TEMP/aws-iam-trust-audit" ./cmd/aws-iam-trust-audit

    - name: Audit trust policies
      id: audit
      shell: bash
      run: |
        args=(--format "${{ inputs.format }}"
              --min-severity "${{ inputs.min-severity }}" --fail-on "${{ inputs.fail-on }}")
        if [[ "${{ inputs.from-aws }}" == "true" ]]; then
          args+=(--from-aws)
          [[ -n "${{ inputs.role-path }}" ]] && args+=(--role-path "${{ inputs.role-path }}")
          from="IAM (iam:ListRoles)"
        else
          args+=(--dir "${{ inputs.dir }}")
          from="${{ inputs.dir }}"
        fi
        [[ -n "${{ inputs.trusted-accounts }}" ]] && args+=(--trusted-accounts "${{ inputs.trusted-accounts }}")
        [[ -n "${{ inputs.ignore }}" ]] && args+=(--ignore "${{ inputs.ignore }}")
        [[ -n "${{ inputs.account }}" ]] && args+=(--account "${{ inputs.account }}")

        out="$RUNNER_TEMP/trust-audit.${{ inputs.format }}"

        # Findings exit non-zero on purpose. GitHub runs composite `run:` steps
        # under `bash -e`, so the exit code has to be caught before it aborts
        # the step and the report is lost.
        set +e
        "$RUNNER_TEMP/aws-iam-trust-audit" "${args[@]}" | tee "$out"
        code=${PIPESTATUS[0]}
        set -e

        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "report-file=$out" >> "$GITHUB_OUTPUT"
        {
          echo "report<<AUDIT_EOF"
          cat "$out"
          echo "AUDIT_EOF"
        } >> "$GITHUB_OUTPUT"

        {
          echo "### aws-iam-trust-audit"
          echo
          echo '```'
          cat "$out"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        if [[ "$code" == "2" ]]; then
          echo "::error::aws-iam-trust-audit could not read the trust policies from $from"
          exit 2
        fi
        if [[ "$code" != "0" ]]; then
          echo "::error::aws-iam-trust-audit found trust policy issues at or above '${{ inputs.fail-on }}'"
          exit 1
        fi
